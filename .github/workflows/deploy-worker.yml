# Deploy x402-ping to the Palm Beach Pete Cloudflare Worker.
# Requires repo secret CLOUDFLARE_API_TOKEN. CLOUDFLARE_ACCOUNT_ID is optional.
name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error title=Missing CLOUDFLARE_API_TOKEN::Required GitHub Actions secret CLOUDFLARE_API_TOKEN is missing or empty. Add a Cloudflare API token (Workers Scripts:Edit, Account:Read) for the Palm Beach Pete account that owns https://x402-ping.palmbeachpete.workers.dev. Settings → Secrets and variables → Actions. Optional secret: CLOUDFLARE_ACCOUNT_ID (set it when the token can see more than one account). This workflow will not deploy until CLOUDFLARE_API_TOKEN is present."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is set."
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set (optional). Wrangler will use the account on the API token."
          else
            echo "CLOUDFLARE_ACCOUNT_ID is set."
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          npx wrangler deploy
